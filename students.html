{% extends 'base.html' %}{% block title %}Students{% endblock %}{% block content %}<div class="container py-4"><span class="tag dark">ADMIN • DATABASE</span><h1 class="fw-bold">Student Records</h1><div class="cardx mt-3"><form class="d-flex gap-2"><input class="form-control" name="q" value="{{q}}" placeholder="Search name, register number or department"><button class="btn btn-primary rounded-pill">Search</button></form><div class="table-responsive mt-3"><table class="table"><tr><th>Name</th><th>Register</th><th>Department</th><th>College</th><th></th></tr>{% for s in students %}<tr><td>{{s['name']}}</td><td>{{s['register_no']}}</td><td>{{s['department'] or '-'}}</td><td>{{s['college'] or '-'}}</td><td><a class="btn btn-sm btn-outline-primary rounded-pill" href="{{url_for('student',sid=s['id'])}}">View</a></td></tr>{% endfor %}</table></div></div></div>{% endblock %}
