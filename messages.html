{% extends 'base.html' %}{% block title %}Messages{% endblock %}{% block content %}<div class="container py-4"><span class="tag dark">ADMIN • MESSAGES</span><h1 class="fw-bold">Contact Messages</h1><div class="row g-3 mt-2">{% for m in messages %}<div class="col-md-6"><div class="cardx"><h5>{{m['name']}}</h5><small class="muted">{{m['email'] or 'No email'}} • {{m['created_at']}}</small><p class="mt-3">{{m['message']}}</p></div></div>{% else %}<p class="muted">No messages.</p>{% endfor %}</div></div>{% endblock %}
