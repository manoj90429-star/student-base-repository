{% extends 'base.html' %}{% block title %}Profile{% endblock %}{% block content %}<div class="container py-5"><div class="formcard"><span class="tag dark">PROFILE & DOCUMENTS</span><h1 class="fw-bold">Update profile</h1><form method="post" enctype="multipart/form-data"><div class="row g-4"><div class="col-lg-8"><div class="row g-3"><div class="col-md-6"><label>Name</label><input class="form-control" name="name" value="{{student['name']}}"></div><div class="col-md-6"><label>Register No</label><input class="form-control" name="register_no" value="{{student['register_no']}}"></div><div class="col-md-4"><label>DOB</label><input class="form-control" type="date" name="dob" value="{{student['dob']}}"></div><div class="col-md-4"><label>Gender</label><input class="form-control" name="gender" value="{{student['gender']}}"></div><div class="col-md-4"><label>Year</label><input class="form-control" name="year" value="{{student['year']}}"></div><div class="col-md-6"><label>Department</label><input class="form-control" name="department" value="{{student['department']}}"></div><div class="col-md-6"><label>College</label><input class="form-control" name="college" value="{{student['college']}}"></div><div class="col-md-4"><label>CGPA</label><input class="form-control" name="cgpa" value="{{student['cgpa']}}"></div><div class="col-md-4"><label>Phone</label><input class="form-control" name="phone" value="{{student['phone']}}"></div><div class="col-md-4"><label>Email</label><input class="form-control" name="email" value="{{student['email']}}"></div><div class="col-12"><label>Address</label><textarea class="form-control" name="address">{{student['address']}}</textarea></div></div></div><div class="col-lg-4"><div class="upload"><div class="text-center">{% if student['photo'] %}<img class="avatarbig" src="{{url_for('files',kind='photos',name=student['photo'])}}">{% else %}<div class="avatarbig ph"><i class="bi bi-person"></i></div>{% endif %}</div><label>Profile Photo</label><input class="form-control mb-3" type="file" name="photo"><label>Academic Document</label><input class="form-control" type="file" name="document"><small class="muted">PDF/DOC/DOCX/images • Max 10 MB</small></div></div></div><div class="text-end mt-4"><button class="btn btn-primary rounded-pill">Save Profile</button></div></form></div></div>{% endblock %}
