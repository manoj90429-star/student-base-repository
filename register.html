{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<div class="container py-5"><div class="formcard"><span class="tag dark">NEW STUDENT</span><h1 class="fw-bold mt-2">Create your account</h1><form method="post"><h5 class="section">Login details</h5><div class="row g-3"><div class="col-md-6"><label>Username *</label><input class="form-control" name="username" required></div><div class="col-md-6"><label>Password *</label><input class="form-control" type="password" name="password" required></div></div><h5 class="section">Student details</h5><div class="row g-3"><div class="col-md-6"><label>Full Name *</label><input class="form-control" name="name" required></div><div class="col-md-6"><label>Register Number *</label><input class="form-control" name="register_no" required></div><div class="col-md-4"><label>DOB</label><input class="form-control" type="date" name="dob"></div><div class="col-md-4"><label>Gender</label><select class="form-select" name="gender"><option></option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="col-md-4"><label>Year</label><select class="form-select" name="year"><option></option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div><div class="col-md-6"><label>Department</label><input class="form-control" name="department"></div><div class="col-md-6"><label>College</label><input class="form-control" name="college"></div><div class="col-md-4"><label>CGPA / Marks</label><input class="form-control" name="cgpa"></div><div class="col-md-4"><label>Phone</label><input class="form-control" name="phone"></div><div class="col-md-4"><label>Email</label><input class="form-control" name="email" type="email"></div><div class="col-12"><label>Address</label><textarea class="form-control" name="address" rows="3"></textarea></div></div><div class="text-end mt-4"><button class="btn btn-primary rounded-pill px-4">Create Account</button></div></form></div></div>{% endblock %}
